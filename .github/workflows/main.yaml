on:
  push:
    branches:
      - master
    tags:
        - "*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # a permissions block replaces the defaults, checkout needs it
      id-token: write # OIDC token for the trusted publishing policy on nuget.org
    steps:    
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # needed for gitversion, checks out all branches and tags

    - name: Setup .NET # runtime tests run on each of these runtimes
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    # The actions write the GitVersion_* variables used by src/Directory.Build.props into the environment of the
    # following steps. GitVersion 6 only reads tags with three numbers (v3.3.0), see "Check the version".
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'

    - name: Use GitVersion
      uses: gittools/actions/gitversion/execute@v4.7.0

    # Without a version the package would be built as 0.0.1, and a release must not be published with a version that
    # differs from its tag (GitVersion 6 does not read a tag like v3.3 as version, it builds 3.3.0-tags-v3-3.1).
    - name: Check the version
      env:
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if (-not $env:GitVersion_SemVer) { throw 'GitVersion did not provide a version.' }
        Write-Host "Version: $env:GitVersion_SemVer"
        if ($env:REF.StartsWith('refs/tags/v')) {
          if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)(-.+)?$') {
            throw "The tag $env:REF_NAME needs three numbers, like v3.3.0."
          }
          if ($Matches[1] -ne $env:GitVersion_MajorMinorPatch) {
            throw "The tag $env:REF_NAME does not match the version $env:GitVersion_MajorMinorPatch calculated by GitVersion."
          }
          # a release has no suffix, GitVersion adds one if it did not find the tag as version
          if (-not $Matches[2] -and $env:GitVersion_SemVer -ne $env:GitVersion_MajorMinorPatch) {
            throw "The tag $env:REF_NAME is a release, but GitVersion calculated the version $env:GitVersion_SemVer."
          }
        }

    - name: Build solution
      run: dotnet build --configuration Release src/MethodBoundaryAspect.Fody.sln

    - name: Run tests - NetFramework
      run: dotnet test src\MethodBoundaryAspect.Fody.UnitTests.NetFramework --configuration Release --no-build

    - name: Run tests - NetCore
      run: dotnet test src\MethodBoundaryAspect.Fody.UnitTests.NetCore --configuration Release --no-build

    - name: Run tests - Runtime (net462, net48, net8.0, net9.0, net10.0)
      run: dotnet test src\MethodBoundaryAspect.Fody.RuntimeTests --configuration Release --no-build

    - name: Create the nuget package
      run: dotnet pack --configuration Release --no-build src\MethodBoundaryAspect\MethodBoundaryAspect.csproj -o Artifacts/Packages
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: 'Artifacts/Packages/**/*.nupkg'
    # Trusted publishing: nuget.org exchanges the OIDC token of this workflow run for an API key that is valid for one
    # hour (policy of the nuget.org account: owner vescon, repository MethodBoundaryAspect.Fody, workflow main.yaml),
    # so the login is right before the push. NUGET_USER is the profile name on nuget.org, not the email address.
    - name: NuGet login (OIDC, short-lived API key)
      uses: NuGet/login@v1
      id: login
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to nuget.org
      run: dotnet nuget push Artifacts/Packages/**/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
      if: startsWith(github.ref, 'refs/tags/v')
