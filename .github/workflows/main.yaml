name: CI

on:
  push:
    branches:
      - master
    tags:
        - "*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60 # the NetFramework tests can hang (e.g. PEVerify with a path that is too long), the default is 6 hours
    permissions:
      contents: read # a permissions block replaces the defaults, checkout needs it
    steps:    
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # needed for gitversion, checks out all branches and tags

    - name: Setup .NET # runtime tests run on each of these runtimes
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x

    # The actions write the GitVersion_* variables used by src/Directory.Build.props into the environment of the
    # following steps. GitVersion 6 only reads tags with three numbers (v3.3.0), see "Check the version".
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'

    - name: Use GitVersion
      uses: gittools/actions/gitversion/execute@v4.7.0

    # Without a version the package would be built as 0.0.1, and a release must not be published with a version that
    # differs from its tag (GitVersion 6 does not read a tag like v3.3 as version, it builds 3.3.0-tags-v3-3.1).
    - name: Check the version
      env:
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if (-not $env:GitVersion_SemVer) { throw 'GitVersion did not provide a version.' }
        Write-Host "Version: $env:GitVersion_SemVer"
        if ($env:REF.StartsWith('refs/tags/v')) {
          if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)(-.+)?$') {
            throw "The tag $env:REF_NAME needs three numbers, like v3.3.0."
          }
          if ($Matches[1] -ne $env:GitVersion_MajorMinorPatch) {
            throw "The tag $env:REF_NAME does not match the version $env:GitVersion_MajorMinorPatch calculated by GitVersion."
          }
          # a release has no suffix, GitVersion adds one if it did not find the tag as version
          if (-not $Matches[2] -and $env:GitVersion_SemVer -ne $env:GitVersion_MajorMinorPatch) {
            throw "The tag $env:REF_NAME is a release, but GitVersion calculated the version $env:GitVersion_SemVer."
          }
        }

    # One project at a time and no reused MSBuild nodes: TestAssembly.NetFramework is built by two projects, a parallel
    # build can fail with a locked DLL.
    - name: Build solution
      run: dotnet build --configuration Release src/MethodBoundaryAspect.Fody.sln -m:1 -nodeReuse:false

    - name: Run tests - NetFramework
      run: dotnet test src\MethodBoundaryAspect.Fody.UnitTests.NetFramework --configuration Release --no-build

    # With the coverage of the weaver: it runs in the test process of this suite only. The settings limit the
    # instrumentation to the weaver, instrumented test assemblies change the IL the weaver reads and fail tests.
    - name: Run tests - NetCore (with coverage of the weaver)
      run: dotnet test src\MethodBoundaryAspect.Fody.UnitTests.NetCore --configuration Release --no-build --settings src\MethodBoundaryAspect.Fody.UnitTests.NetCore\coverage.runsettings --results-directory Artifacts/Coverage

    - name: Write the coverage to the summary
      run: |
        $report = Get-ChildItem Artifacts/Coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
        if (-not $report) { throw 'No coverage report was written.' }
        $coverage = ([xml](Get-Content $report.FullName)).coverage
        $lines = [math]::Round([double]::Parse($coverage.'line-rate', [cultureinfo]::InvariantCulture) * 100, 1)
        $branches = [math]::Round([double]::Parse($coverage.'branch-rate', [cultureinfo]::InvariantCulture) * 100, 1)
        "Coverage of the weaver by the NetCore unit tests: $lines % of the lines, $branches % of the branches" >> $env:GITHUB_STEP_SUMMARY

    - name: Upload the coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: 'Artifacts/Coverage/**/coverage.cobertura.xml'

    - name: Run tests - Runtime (net462, net48, net481, net8.0, net9.0, net10.0, net11.0)
      run: dotnet test src\MethodBoundaryAspect.Fody.RuntimeTests --configuration Release --no-build

    # In Debug builds the compiler generates classes instead of structs for the state machines of async methods, the
    # weaver handles both. Release builds (the tests above) only cover the structs. The weaver is not referenced by the
    # test project, so it has to be built in Debug as well.
    - name: Run tests - Runtime (Debug build, state machines are classes)
      run: |
        dotnet build --configuration Debug src\MethodBoundaryAspect.Fody\MethodBoundaryAspect.Fody.csproj
        dotnet build --configuration Debug src\MethodBoundaryAspect.Fody.RuntimeTests -f net10.0
        dotnet test src\MethodBoundaryAspect.Fody.RuntimeTests --configuration Debug --no-build -f net10.0

    - name: Create the nuget package
      run: dotnet pack --configuration Release --no-build src\MethodBoundaryAspect\MethodBoundaryAspect.csproj -o Artifacts/Packages
    
    # Builds a small project with the package from the previous step like a user does (weaver and xcf from the package,
    # <MethodBoundaryAspect /> in FodyWeavers.xml) and runs it on net8.0 and net48.
    - name: Test the nuget package
      run: src\MethodBoundaryAspect.Fody.PackageSmokeTest\run.ps1

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: 'Artifacts/Packages/**/*.nupkg'

    # The samples use the released package from nuget.org, this only checks that they still build and run. The
    # .NET Framework sample has project files in the old format, which the dotnet CLI cannot restore.
    - name: Build and run the samples
      run: |
        dotnet build Samples\HelloWorld_NetCore\HelloWorld_NetCore.sln --configuration Release
        dotnet run --project Samples\HelloWorld_NetCore\HelloWorld_NetCore --configuration Release --no-build
        if ($LASTEXITCODE -ne 0) { throw 'The .NET sample failed.' }
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        if (-not $msbuild) { throw 'MSBuild of Visual Studio was not found.' }
        & $msbuild Samples\HelloWorld_NetFramework\HelloWorld_NetFramework.sln -restore -p:Configuration=Release -v:minimal
        if ($LASTEXITCODE -ne 0) { throw 'The .NET Framework sample did not build.' }
        Samples\HelloWorld_NetFramework\HelloWorld_NetFramework\bin\Release\HelloWorld_NetFramework.exe
        if ($LASTEXITCODE -ne 0) { throw 'The .NET Framework sample failed.' }

  # Its own job, so only the run of a version tag gets the permission to request the OIDC token. It publishes the
  # package the build job tested.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for the trusted publishing policy on nuget.org
    steps:
    - name: Download the package
      uses: actions/download-artifact@v7
      with:
        name: nupkg
        path: Artifacts/Packages

    # Trusted publishing: nuget.org exchanges the OIDC token of this workflow run for an API key that is valid for one
    # hour (policy of the nuget.org account: owner vescon, repository MethodBoundaryAspect.Fody, workflow main.yaml),
    # so the login is right before the push. NUGET_USER is the profile name on nuget.org, not the email address.
    - name: NuGet login (OIDC, short-lived API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to nuget.org
      run: dotnet nuget push Artifacts/Packages/**/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
